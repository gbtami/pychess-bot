# PyChess-local uv environment: deliberately no package build or Python module
# rename. Keep dependency constraints aligned with upstream requirements.txt.
[project]
name = "pychess-bot"
version = "0.1.0"
description = "PyChess variant BOT bridge, based on lichess-bot"
requires-python = ">=3.10"
dependencies = [
  "chess~=1.11",
  "PyYAML~=6.0",
  "requests~=2.34",
  "backoff~=2.2",
  "rich~=15.0",
  "pyffish==0.0.90",
  "pyffish-alice==0.0.3",
  "typing_extensions>=4.0",
]

[dependency-groups]
dev = [
  "pytest~=9.1",
  "pytest-timeout~=2.4",
  "ruff~=0.17.1",
  "mypy~=2.4",
  "types-requests~=2.33",
  "types-PyYAML~=6.0",
  "tomli>=1.1.0; python_version < '3.11'",
]

[tool.uv]
package = false
