name: PyChess Bot CI

on:
  workflow_dispatch:
  push:
    branches: [pychess-bot]
  pull_request:
    branches: [pychess-bot]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-typecheck:
    name: ${{ matrix.check }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - check: ruff
            python: "3.14"
          - check: pytest
            python: "3.12"
          - check: pytest
            python: "3.14"
          - check: mypy
            python: "3.14"

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # The PyChess fork has a local-only pyproject.toml; no package build is needed.
      # Until a lockfile is committed, resolve from the declared constraints.
      - name: Check dependency manifests agree
        run: python tools/check_dependency_sync.py

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python }} --group dev

      - name: Restore engines
        id: restore-engines
        if: matrix.check == 'pytest'
        uses: actions/cache/restore@v5
        with:
          path: TEMP
          key: ${{ runner.os }}-engines

      - name: Run ruff
        if: matrix.check == 'ruff'
        run: uv run --no-sync ruff check --config test_bot/ruff.toml

      # --help exits before reading config.yml, creating an engine, or
      # connecting to PyChess. Catch broken imports/entrypoint after uv sync.
      - name: Smoke test BOT CLI (offline)
        if: matrix.check == 'pytest'
        run: uv run --no-sync python lichess-bot.py --help

      - name: Run pytest
        if: matrix.check == 'pytest'
        # Never pass production credentials to unit tests. The inherited
        # test_lichess integration case makes live calls to lichess.org.
        run: >
          uv run --no-sync pytest --log-cli-level=10 --timeout=60
          --ignore=test_bot/test_bot.py
          --ignore=test_bot/test_external_moves.py
          --deselect=test_bot/test_lichess.py::test_lichess

      - name: Save engines
        if: matrix.check == 'pytest' && steps.restore-engines.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: TEMP
          key: ${{ runner.os }}-engines

      - name: Run mypy
        if: matrix.check == 'mypy'
        run: uv run --no-sync mypy --strict .
